<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <label class="form-label" for="color-input">Couleur</label>
      <input
        appRainbow
        [(ngModel)]="color"
        id="color-input"
        class="form-control mb-3 border-4 shadow-none"
        type="text"
      />

      <div
        class="ratio p-5 border rounded mb-3"
        [style.backgroundColor]="color()"
      ></div>

      <button type="button" class="btn btn-primary" (click)="resetColor()">
        Réinitialiser
      </button>
    </div>
  </div>
</div>
