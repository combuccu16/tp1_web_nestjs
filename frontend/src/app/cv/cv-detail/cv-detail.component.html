@if (cv(); as cv) {
  <div class="card">
    <img
      class="card-img-top"
      [src]="cv.path || 'images/cv.png'"
      [alt]="cv.firstname + ' ' + cv.name"
    />
    <div class="card-body">
      <h5 class="card-title">{{ cv.firstname }} {{ cv.name }}</h5>
      <blockquote class="blockquote">
        <p>« La curiosité et la rigueur transforment les idées en solutions utiles. »</p>
      </blockquote>
      <h6>Job Description</h6>
      <p class="card-text">{{ cv.job }}</p>
      <p class="card-text mb-1">Âge : {{ cv.age }}</p>
      <p class="card-text mb-1">CIN : {{ cv.cin }}</p>
      <p class="card-text mb-0">Métier : {{ cv.job }}</p>
      <div class="d-flex gap-2 mt-3">
        <button type="button" class="btn btn-success" (click)="embaucher()">Embaucher</button>
        <a class="btn btn-outline-primary" [routerLink]="['/cv', cv.id]">Détails</a>
      </div>
    </div>
  </div>
}
