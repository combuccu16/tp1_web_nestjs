<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
  <div class="container">
    <a class="navbar-brand fw-semibold" routerLink="/">CvTech</a>

    <ul class="navbar-nav flex-row flex-wrap me-auto gap-2">
      <li class="nav-item">
        <a
          class="nav-link"
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          >Home</a
        >
      </li>
      @for (link of links; track link.path) {
        <li class="nav-item">
          <a class="nav-link" [routerLink]="link.path" routerLinkActive="active">{{
            link.label
          }}</a>
        </li>
      }
      @for (label of upcomingLinks; track label) {
        <li class="nav-item">
          <span class="nav-link disabled" title="Prochains TP">{{ label }}</span>
        </li>
      }
    </ul>

    <div class="d-flex gap-2">
      @if (isAuthenticated()) {
        <button type="button" class="btn btn-sm btn-outline-danger" (click)="logout()">
          Logout
        </button>
      } @else {
        <a class="btn btn-sm btn-outline-primary" routerLink="/login" routerLinkActive="active"
          >Login</a
        >
      }
      @for (language of languages; track language) {
        <button type="button" class="btn btn-sm btn-outline-secondary" disabled>
          {{ language }}
        </button>
      }
    </div>
  </div>
</nav>
