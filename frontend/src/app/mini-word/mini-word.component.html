<section class="mini-word">
  <h2>Mini word</h2>

  <div class="mini-word__controls">
    <label>
      Color
      <input type="color" [formField]="styleForm.color" />
    </label>

    <label>
      Size (px)
      <input type="number" [formField]="styleForm.size" />
    </label>

    <label>
      Font
      <select [formField]="styleForm.font">
        @for (fontName of fonts; track fontName) {
          <option [value]="fontName">{{ fontName }}</option>
        }
      </select>
    </label>
  </div>

  <p
    [style.color]="style().color"
    [style.font-size.px]="style().size"
    [style.font-family]="style().font"
  >
    CvTech — Mini Word
  </p>
</section>
